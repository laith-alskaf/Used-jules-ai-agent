name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js 18
      uses: actions/setup-node@v2
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Lint
      run: |
        cd backend
        npm run lint

    - name: Test
      run: |
        cd backend
        npm test

    - name: Build
      run: |
        cd backend
        npm run build

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./backend
        push: true
        tags: your-docker-hub-username/your-repo-name:latest
